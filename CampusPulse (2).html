<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CampusPulse</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;600;700&family=DM+Mono:wght@500&display=swap">

<style>

.hero h1{font:800 clamp(30px,6vw,54px)/1.02 var(--fd);margin:10px 0;max-width:640px;letter-spacing:-1.5px}.hero u{text-decoration:none;background:linear-gradient(transparent 58%,var(--lime) 58%)}.hero p{max-width:480px;margin:0;font-size:16px}

.btn{background:var(--pr);color:#1b1a17;border:2px solid var(--tx);border-radius:10px;padding:9px 16px;font:700 14px 'DM Sans',sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--tx);transition:.12s}.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--tx)}.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--tx)}.btn.s{background:var(--card);color:var(--tx)}.btn.g{background:#7be0a6}.btn.r{background:#ff8fb1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:2px solid var(--tx);background:var(--card);color:var(--tx);border-radius:99px;padding:4px 14px;cursor:pointer;font:600 13px 'DM Sans',sans-serif}.chip.on{background:var(--lime);color:#1b1a17;box-shadow:2px 2px 0 var(--tx)}
h2{margin:30px 0 12px;font-size:25px;font-weight:800;letter-spacing:-.6px;display:inline-block;background:linear-gradient(transparent 62%,var(--hl) 62%)}.grid+h2,.card+h2,.chips+h2{display:block;width:fit-content}label{font:500 12px var(--fm);color:var(--mu);display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
#m{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}#m.on{display:flex}#mb{background:var(--card);border:2px solid var(--tx);box-shadow:8px 8px 0 var(--pr);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}.kpi b{font:800 36px/1.1 var(--fd);display:block}
.alert{border:2px solid var(--tx);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}.alert.er{background:#ffc2d640}.alert.ok{background:#b7f0cf40}
.tl{border-left:2px dashed var(--tx);margin:8px 0 0 6px;padding-left:12px}.tl div{margin:4px 0;font-size:13px}
.bar{height:12px;border:2px solid var(--tx);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}.ovf{overflow-x:auto}video{width:100%;border-radius:12px;margin-top:8px;border:2px solid var(--tx)}

@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f5efe3;--card:#fffaf0;--tx:#17140f;--mu:#6a6355;--bd:#17140f30;--line:#17140f30;--dots:#17140f1a;--hl:#c6f43299}}
.card,.tk,select,input,textarea,.btn,.chip,.alert,.bar,.seat,#mb,video,.hero,.tick,header,.stub,.tk:before,.tk:after,.stats span{border-color:var(--line)!important;box-shadow:none!important}
.card,.hero{background:color-mix(in srgb,var(--card) 82%,transparent)!important;color:var(--tx)!important;border-radius:18px}.hero:after{background:var(--pr);opacity:.25;border:0}.hero .dot{background:var(--pr)}.kick{color:var(--pr)}.hero p{color:var(--mu)}
nav button.on{background:var(--pr);color:#15110c}.tick{background:var(--card)!important;color:var(--mu)!important}#mb{box-shadow:0 0 70px color-mix(in srgb,var(--pr) 35%,transparent)!important}.btn,nav button,.chip{border-radius:99px}.tk:hover{box-shadow:0 0 30px color-mix(in srgb,var(--pr) 35%,transparent)!important}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(60vmax 60vmax at 72% 45%,color-mix(in srgb,var(--pr) 22%,transparent),transparent 62%);transition:.6s}header,main{position:relative;z-index:1}body.app main{padding-bottom:210px}
.eb{font:500 12px var(--fm);letter-spacing:.16em;color:var(--pr);margin:0}.hm{display:grid;gap:18px;align-items:center}@media(min-width:920px){.hm{grid-template-columns:1fr 1.1fr;min-height:calc(100vh - 120px)}}
.hm h1{font:800 clamp(32px,5vw,56px)/1.02 var(--fd);letter-spacing:-1.5px;margin:10px 0 18px}.hm h1 em{font-style:normal;color:var(--pr)}
.panel{border:1px solid var(--line);background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:20px;padding:22px;min-height:260px;animation:up .45s}@keyframes up{from{opacity:0;transform:translateY(12px)}}.panel h2{font:800 28px/1.1 var(--fd);margin:8px 0;background:none;display:block}.panel p{color:var(--mu);margin:0 0 12px}.panel ul{margin:0;padding:0;list-style:none}.panel li{padding:6px 0 6px 22px;position:relative;border-top:1px dashed var(--line);font-size:14.5px}.panel li:before{content:'';position:absolute;left:2px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--pr)}.num{font:500 12px var(--fm);color:var(--pr);letter-spacing:.12em}
.hint{text-align:center;font:500 12px var(--fm);color:var(--mu);margin:10px 0 0;letter-spacing:.08em}
#wh{--W:min(92vw,62vh,540px);width:var(--W);height:var(--W);perspective:calc(var(--W)*2.4);touch-action:none;cursor:grab;user-select:none;position:relative;margin:0 auto}#wh:active{cursor:grabbing}
#wh.dock{--W:170px;position:fixed;right:14px;bottom:14px;z-index:8;border:1px solid var(--line);border-radius:50%;background:color-mix(in srgb,var(--card) 75%,transparent);backdrop-filter:blur(6px);margin:0}
#rg{position:absolute;inset:0;transform-style:preserve-3d}.or{position:absolute;left:50%;top:50%;width:calc(var(--W)*.3);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffc,var(--pr) 38%,#120a20);box-shadow:0 0 calc(var(--W)*.1) var(--pr)}
.rn{position:absolute;inset:8%;border:1px dashed var(--line);border-radius:50%}
.cd{position:absolute;left:50%;top:50%;width:calc(var(--W)*.3);height:calc(var(--W)*.4);border-radius:calc(var(--W)*.04);border:1.5px solid var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 32%,var(--card)),var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--tx);backface-visibility:hidden;cursor:pointer}
.cd i{font-style:normal;font-size:calc(var(--W)*.09)}.cd b{font-family:var(--fd);font-size:calc(var(--W)*.04)}.cd small{font:500 calc(var(--W)*.024) var(--fm);color:var(--mu)}.cd.on{border-width:2px;box-shadow:0 0 calc(var(--W)*.06) var(--c)}
#wh.dock .cd b,#wh.dock .cd small{display:none}#dl{display:none}#wh.dock #dl{display:block;position:absolute;left:50%;top:-34px;transform:translateX(-50%);font:500 12px var(--fm);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 12px;white-space:nowrap}
body.auth #wh{display:none}details summary{cursor:pointer;margin:12px 0;color:var(--mu)}.mu b{color:var(--tx)}</style></head><body>
<div class="glow"></div><div id="ts" style="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--pr);border-radius:99px;padding:8px 18px;z-index:30;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center"></div><header><span class="logo" onclick="go('home')" style="cursor:pointer"><i class="dot"></i>CampusPulse</span><nav id="nav"></nav><span id="who" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"></span><span id="role"></span></header>
<main id="app"></main><div id="wh" class="big" aria-label="Rotatable 3D feature wheel"><div id="rg"><div class="rn" style="transform:rotateX(90deg)"></div><div class="rn" style="transform:rotateX(90deg) translateZ(calc(var(--W)*.2))"></div><div class="rn" style="transform:rotateX(90deg) translateZ(calc(var(--W)*-.2))"></div><div class="or"></div></div><div id="dl"></div></div><div id="m" onclick="if(event.target.id=='m')cm()"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const tm=t=>{const[a,b]=t.split(':');return +a*60+ +b},hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const V={"Main Auditorium":600,"Seminar Hall A":120,"Innovation Lab":60,"Open Air Theatre":400,"Library Atrium":150},CATS=["Tech","Cultural","Sports","Workshop","Career","Club"];
let mem={};const store={get(k){try{const v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}return mem[k]||null},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const code=()=>'CP-'+Math.random().toString(36).slice(2,8).toUpperCase();
function seed(){const H=(s,by)=>[{s:'submitted',t:Date.now()-864e5*3,by,n:''}].concat(s=='pending'?[]:[{s,t:Date.now()-864e5*2,by:'Admin',n:s=='approved'?'Looks good':'Venue clash'}]);
const E=[['Hack the Campus 24h','Tech',2,'09:00','18:00','Innovation Lab',60,'Coding Club','Build, ship and pitch in a day. Mentors from industry, prizes worth ₹50k.'],['Spring Cultural Fest Night','Cultural',4,'18:00','21:00','Open Air Theatre',400,'Cultural Committee','Music, dance and drama showcase by student troupes.'],['Resume & LinkedIn Workshop','Career',1,'14:00','16:00','Seminar Hall A',120,'Placement Cell','Craft an ATS-friendly resume and a standout LinkedIn profile.'],['Inter-Dept Football Finals','Sports',3,'16:00','18:00','Open Air Theatre',400,'Sports Council','Final showdown of the season. Come cheer your department!'],['AI/ML Bootcamp','Workshop',5,'10:00','13:00','Seminar Hall A',120,'AI Club','Hands-on intro to machine learning with Python notebooks.'],['Photography Walk','Club',6,'07:00','09:00','Library Atrium',150,'Photo Club','Golden-hour campus photo walk. Bring any camera.'],['Guest Lecture: Quantum Computing','Tech',7,'11:00','12:30','Main Auditorium',600,'Physics Society','A researcher explains quantum computing for beginners.']];
const ev=E.map((e,i)=>({id:'e'+(i+1),title:e[0],cat:e[1],date:addD(e[2]),start:e[3],end:e[4],venue:e[5],cap:e[6],vcap:V[e[5]],org:e[7],desc:e[8],status:i==6?'pending':'approved',hist:H(i==6?'pending':'approved',e[7])}));
const N=['Aarav','Diya','Kabir','Meera','Rohan','Sana','Ishaan','Anika','Vihaan','Tara'],regs=[];
ev.filter(e=>e.status=='approved').forEach((e,i)=>{const n=8+Math.floor(Math.random()*24);for(let k=0;k<n;k++)regs.push({id:code(),eid:e.id,name:N[k%10]+' '+String.fromCharCode(65+k%26),email:'s'+i+k+'@campus.edu',code:code(),at:Date.now()-Math.random()*6.5*864e5,checked:e.id=='e3'&&Math.random()<.5?Date.now()-36e5:null})});
return{events:ev,regs,user:{name:'',email:'',interests:['Tech','Workshop']}}}
let S=store.get('cp4')||seed(),role='Student',view='home',cat='All',q='',when='any';const save=()=>store.set('cp3',S);
const TABS={Student:[['discover','Discover'],['tickets','My Tickets']],Organizer:[['host','Host Event'],['track','My Events'],['dash','Dashboard'],['checkin','Check-in']],Admin:[['approve','Approvals'],['dash','Dashboard'],['checkin','Check-in']]};
function setRole(r){role=r;view=TABS[r][0][0];draw()}function go(v){view=v;draw()}
const seats=e=>e.cap-S.regs.filter(r=>r.eid==e.id).length,byId=id=>S.events.find(e=>e.id==id),fd=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const sc=s=>({approved:'ok',pending:'wn',rejected:'er',cancelled:'er',draft:''}[s]);
function conflicts(e){return S.events.filter(o=>o.id!=e.id&&o.venue==e.venue&&o.date==e.date&&o.status!='rejected'&&tm(o.start)<tm(e.end)&&tm(e.start)<tm(o.end))}
function suggest(e){const d=tm(e.end)-tm(e.start),free=(v,s)=>!conflicts({...e,venue:v,start:hm(s),end:hm(s+d)}).length;
const alts=Object.keys(V).filter(v=>v!=e.venue&&V[v]>=e.cap&&free(v,tm(e.start))),slots=[];for(let s=480;s+d<=1260;s+=30)if(free(e.venue,s))slots.push(s);
slots.sort((a,b)=>Math.abs(a-tm(e.start))-Math.abs(b-tm(e.start)));return{alts,slots:slots.slice(0,4).sort((a,b)=>a-b).map(s=>hm(s)+'–'+hm(s+d))}}
function score(e){let s=0;if(S.user.interests.includes(e.cat))s+=60;const days=(new Date(e.date)-new Date())/864e5;s+=Math.max(0,20-days*2);s+=Math.min(20,S.regs.filter(r=>r.eid==e.id).length/e.cap*40);return Math.round(Math.min(99,s))}
const CC={Tech:'#9bd1ff',Cultural:'#ff9ecb',Sports:'#c6f432',Workshop:'#ffd166',Career:'#b9a6ff',Club:'#7fe3c4'};
function card(e,rec){const ts=seats(e),d=new Date(e.date+'T00:00'),L=o=>d.toLocaleDateString(undefined,o);return`<div class="tk" onclick="openEv('${e.id}')"><div class="stub" style="background:${CC[e.cat]||'#ddd'}"><span>${L({month:'short'})}</span><b>${d.getDate()}</b><span>${L({weekday:'short'})}</span></div><div class="tkb"><span class="tag">${e.cat}</span>${rec?`<span class="tag ok">${score(e)}% match</span>`:''}<h3>${esc(e.title)}</h3><div class="mu">⏰ ${e.start}–${e.end} · 📍 ${e.venue}</div><div class="seat"><i style="width:${(e.cap-ts)/e.cap*100}%"></i></div><div class="mu">${ts>0?ts+' seats left':'Sold out'} · ${esc(e.org)}</div></div></div>`}
function heroHTML(){const A=S.events.filter(e=>e.status=='approved'&&e.date>=addD(0)),k=A.map(e=>esc(e.title)).join('  ✦  ')+'  ✦  ';return`<div class="hero"><div class="kick"><i class="dot"></i>LIVE ON CAMPUS</div><h1>Find your next <u>great night</u> on campus.</h1><p>Every event in one place. Discover it, grab a QR ticket, show up.</p><div class="stats"><span><b>${A.length}</b> events live</span><span><b>${S.regs.length}</b> students joined</span><span><b>${A.reduce((n,e)=>n+Math.max(0,seats(e)),0)}</b> seats open</span></div></div><div class="tick"><div>${k+k}</div></div>`}
function draw(){$('#nav').innerHTML=TABS[role].map(t=>`<button class="${view==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');$('#role').value=role;$('#app').innerHTML=V_[view]();if(view=='host')hostInit();if(view=='checkin')stopCam()}
const V_={
home(){return`<div class="hm"><section><p class="eb">CAMPUSPULSE · 360° EVENT JOURNEY</p><h1>One platform. <em>Every step</em> of a campus event.</h1><div class="panel" id="pn"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="openSel()">Open this feature →</button><button class="btn s" onclick="go('discover')">Browse events</button></div></section><section><div id="slot"></div><p class="hint">DRAG IN ANY DIRECTION · SCROLL · ← → · CLICK A CARD</p></section></div>`},
discover(){const td=addD(0),wk=addD(7);let L=S.events.filter(e=>e.status=='approved'&&e.date>=td&&(cat=='All'||e.cat==cat)&&(!q||(e.title+e.desc+e.org+e.venue).toLowerCase().includes(q))&&(when=='any'||(when=='today'?e.date==td:e.date<=wk))).sort((a,b)=>a.date.localeCompare(b.date));
const rec=S.events.filter(e=>e.status=='approved'&&e.date>=td).sort((a,b)=>score(b)-score(a)).slice(0,3);
return`${heroHTML()}
<div class="card"><b>Your interests</b> <span class="mu">(drives recommendations)</span><div class="chips">${CATS.map(c=>`<button class="chip ${S.user.interests.includes(c)?'on':''}" onclick="tgI('${c}')">${c}</button>`).join('')}</div></div>

V_.checkin=function(){const ev=S.events.filter(e=>e.status=='approved');return`<h2>📷 QR Check-in</h2><div class="card"><label>Event</label><select id="ce" onchange="ciStat()">${ev.map(e=>`<option value="${e.id}" ${window.ce==e.id?'selected':''}>${esc(e.title)}</option>`).join('')}</select><label>Ticket code</label><div class="row"><input id="cc" placeholder="CP-XXXXXX" onkeydown="if(event.key=='Enter')doCheck(this.value)"><button class="btn" onclick="doCheck($('#cc').value)">Check in</button></div><div class="row" style="margin-top:10px"><button class="btn s" onclick="startCam()">📷 Scan with camera</button><label class="btn s" style="margin:0;text-align:center;text-transform:none;letter-spacing:0;font:700 14px 'DM Sans'">🖼 Scan QR from photo<input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanImg(this)"></label></div><div id="cr"></div><video id="vd" style="display:none" playsinline muted></video><div id="cs" style="margin-top:12px"></div></div>`};
async function startCam(){try{if(!navigator.mediaDevices)throw 0;strm=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const v=$('#vd');v.srcObject=strm;v.style.display='block';await v.play();const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});$('#cr').innerHTML='<div class="alert ok">Point the camera at the ticket QR…</div>';const loop=()=>{if(!strm)return;if(v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const q=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(q&&q.data){stopCam();v.style.display='none';doCheck(q.data);return}}raf=requestAnimationFrame(loop)};loop()}catch(e){$('#cr').innerHTML='<div class="alert er">Camera is blocked or unavailable here. Use “Scan QR from photo” or type the code.</div>'}}
function scanImg(inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);const q=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(q&&q.data)doCheck(q.data);else $('#cr').innerHTML='<div class="alert er">No QR code found in that photo. Try a sharper, closer picture.</div>';inp.value=''};im.src=URL.createObjectURL(f)}
